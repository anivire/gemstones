architectury {
	common(rootProject.enabled_platforms.split(','))
}

sourceSets {
	main {
		resources {
			srcDir 'src/main/generated'
			srcDir 'src/main/resources'
		}
	}
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	if (sourceSets.findByName('client') == null) {
		splitEnvironmentSourceSets()
	}

	mods {
		'gemstones' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rootProject.rei_version}"
	modCompileOnly "dev.emi:emi-fabric:${rootProject.emi_version}"
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
}

test {
	useJUnitPlatform()
	workingDir = layout.buildDirectory.dir('junit').get().asFile
	doFirst { workingDir.mkdirs() }
	systemProperty 'gemstones.resources', file('src/main/resources').absolutePath
	systemProperty 'gemstones.sources', file('src/main/java').absolutePath
}

tasks.processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
